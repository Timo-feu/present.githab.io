<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- <div style="width: 400px; border: 2px solid black; height: 1200px; position: absolute;"></div> -->
    <dialog class="popupmodal" aria-labelledby="label" id="modal">
        <img src="./foto/окошко.png" alt="window" class="modal-window">
        <div class="modal-up">
            <div id="head"></div>
            <button onclick="window.modal.close()" type="button" class="modal-exit">
                <img src="./foto/transparent-Photoroom.png" alt="exit" class="ex-foto">
            </button>
        </div>
        <div class="modal-main">
            <p id="modal-text">...</p>
        </div>
    </dialog>

    <div class="abs">
        <div class="img-conteiner">
            <img class="tree" src="./foto/ёлка.png" alt="ёлка">
        </div>
        <div class="tree-container">
            <button class="btn-1 fn" onclick="window.SearchForPopup(1)" type="button"><img class="btn-img" src="./foto/фонарь.png" alt="fonar"></button>
            <button class="btn-1 mn" onclick="window.SearchForPopup(2)" type="button"><img class="btn-img mn-img" src="./foto/монетка.png" alt="money"></button>
            <button class="btn-1 vr" onclick="window.SearchForPopup(3)" type="button"><img class="btn-img" src="./foto/веер.png" alt="veer"></button>
            <button class="btn-1 pl" onclick="window.SearchForPopup(4)" type="button"><img class="btn-img e-img" src="./foto/еда.png" alt="pelmen"></button>
            <button class="btn-1 pd" onclick="window.SearchForPopup(5)" type="button"><img class="btn-img" src="./foto/подарок.png" alt="prize"></button>
        </div>
    </div>
    <div class="Snowflakes" id="tr">
        <div class="snow"></div>
    </div>
    <script src="script.js" lang="JS"></script>
</body>
</html>
