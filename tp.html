<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Волшебная Веб-Ёлка</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0f2b46, #1a535c, #2a9d8f);
            font-family: 'Arial', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            overflow-x: hidden;
        }

        .container {
            text-align: center;
            padding: 20px;
            position: relative;
            z-index: 10;
        }

        h1 {
            font-size: 3em;
            margin-bottom: 30px;
            text-shadow: 0 0 20px #00ff88, 2px 2px 10px rgba(0,0,0,0.5);
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4, #45b7d1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: titleGlow 3s ease-in-out infinite alternate;
        }

        .tree-container {
            position: relative;
            margin: 40px auto;
            perspective: 1000px;
        }

        /* Основные ярусы ёлки */
        .layer {
            position: relative;
            margin: 0 auto;
        }

        /* Разнообразные формы ярусов */
        .tier-1 {
            width: 60px;
            height: 80px;
            background: #2d5a27;
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
            margin: 0 auto;
        }

        .tier-2 {
            width: 120px;
            height: 100px;
            background: #2a5524;
            clip-path: polygon(50% 0%, 20% 100%, 80% 100%);
            margin: -10px auto 0;
        }

        .tier-3 {
            width: 180px;
            height: 120px;
            background: #275320;
            clip-path: polygon(50% 0%, 10% 100%, 90% 100%);
            margin: -15px auto 0;
        }

        .tier-4 {
            width: 240px;
            height: 140px;
            background: #234d1c;
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
            margin: -20px auto 0;
        }

        .tier-5 {
            width: 300px;
            height: 160px;
            background: #1f4718;
            clip-path: polygon(50% 0%, 5% 100%, 95% 100%);
            margin: -25px auto 0;
        }

        /* Декоративные элементы на ярусах */
        .layer-decoration {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .bubble {
            position: absolute;
            border-radius: 50%;
            opacity: 0.8;
            animation: float 4s ease-in-out infinite;
        }

        /* Ствол с текстурой */
        .trunk {
            width: 50px;
            height: 80px;
            background: linear-gradient(90deg, #8B4513, #a0522d, #8B4513);
            margin: -10px auto 0;
            border-radius: 10px 10px 5px 5px;
            position: relative;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }

        .trunk:before {
            content: '';
            position: absolute;
            width: 30px;
            height: 5px;
            background: #654321;
            top: 20px;
            left: 10px;
            border-radius: 2px;
        }

        .trunk:after {
            content: '';
            position: absolute;
            width: 30px;
            height: 5px;
            background: #654321;
            top: 40px;
            left: 10px;
            border-radius: 2px;
        }

        /* Сложная звезда */
        .star {
            position: absolute;
            top: -40px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 40px;
            animation: spin 8s linear infinite, glow 2s ease-in-out infinite alternate;

filter: drop-shadow(0 0 10px gold);
            z-index: 20;
        }

        /* Украшения */
        .decoration {
            position: absolute;
            border-radius: 50%;
            animation: twinkle 3s infinite, swing 4s ease-in-out infinite;
            cursor: pointer;
            transition: transform 0.3s ease;
            z-index: 15;
        }

        .decoration:hover {
            transform: scale(1.3);
            z-index: 25;
        }

        .decoration.red { background: radial-gradient(circle at 30% 30%, #ff4444, #cc0000); }
        .decoration.blue { background: radial-gradient(circle at 30% 30%, #4444ff, #0000cc); }
        .decoration.yellow { background: radial-gradient(circle at 30% 30%, #ffff44, #cccc00); }
        .decoration.purple { background: radial-gradient(circle at 30% 30%, #ff44ff, #cc00cc); }
        .decoration.orange { background: radial-gradient(circle at 30% 30%, #ff8844, #cc6600); }
        .decoration.green { background: radial-gradient(circle at 30% 30%, #44ff44, #00cc00); }
        .decoration.cyan { background: radial-gradient(circle at 30% 30%, #44ffff, #00cccc); }

        /* Снег */
        .snow {
            position: absolute;
            bottom: -20px;
            width: 120%;
            height: 50px;
            background: white;
            border-radius: 50% 50% 0 0;
            opacity: 0.9;
            left: -10%;
            filter: blur(2px);
        }

        /* Подарки сложной формы */
        .gifts {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin-top: 40px;
            flex-wrap: wrap;
        }

        .gift {
            width: 60px;
            height: 60px;
            position: relative;
            transform-style: preserve-3d;
            animation: giftFloat 6s ease-in-out infinite;
        }

        .gift:nth-child(1) { 
            background: linear-gradient(45deg, #ff4444, #ff6b6b);
            animation-delay: 0s;
        }
        .gift:nth-child(2) { 
            background: linear-gradient(45deg, #4444ff, #6b6bff);
            animation-delay: 1s;
        }
        .gift:nth-child(3) { 
            background: linear-gradient(45deg, #44ff44, #6bff6b);
            animation-delay: 2s;
        }
        .gift:nth-child(4) { 
            background: linear-gradient(45deg, #ffff44, #ffff6b);
            animation-delay: 3s;
        }

        .gift:before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 20px;
            background: gold;
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
        }

        .gift:after {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%) rotate(90deg);
            width: 20px;
            height: 20px;
            background: gold;
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
        }

        /* Управление */
        .controls {
            margin: 30px 0;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            background: linear-gradient(45deg, #4CAF50, #45a049);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }

        /* Анимации */
        @keyframes twinkle {
            0%, 100% { 
                opacity: 1; 
                filter: brightness(1) drop-shadow(0 0 5px currentColor);
            }
            50% { 
                opacity: 0.6; 
                filter: brightness(1.5) drop-shadow(0 0 15px currentColor);

}
        }

        @keyframes glow {
            0% { 
                filter: drop-shadow(0 0 5px gold) brightness(1);
            }
            100% { 
                filter: drop-shadow(0 0 20px gold) brightness(1.3);
            }
        }

        @keyframes spin {
            from { transform: translateX(-50%) rotate(0deg); }
            to { transform: translateX(-50%) rotate(360deg); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(180deg); }
        }

        @keyframes swing {
            0%, 100% { transform: rotate(-5deg); }
            50% { transform: rotate(5deg); }
        }

        @keyframes giftFloat {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(5deg); }
        }

        @keyframes titleGlow {
            0% { filter: hue-rotate(0deg); }
            100% { filter: hue-rotate(360deg); }
        }

        /* Фоновые элементы */
        .background-elements {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .bg-snowflake {
            position: absolute;
            color: rgba(255,255,255,0.3);
            font-size: 20px;
            animation: bgFloat 10s linear infinite;
        }

        @keyframes bgFloat {
            0% {
                transform: translateY(-100px) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="background-elements" id="background"></div>
    
    <div class="container">
        <h1>🎄 Волшебная Ёлка 🎄</h1>
        
        <div class="controls">
            <button onclick="addDecoration()">✨ Добавить украшение</button>
            <button onclick="toggleAnimation()">🎭 Анимации</button>
            <button onclick="changeTheme()">🎨 Сменить тему</button>
            <button onclick="addGift()">🎁 Добавить подарок</button>
        </div>

        <div class="tree-container">
            <div class="star">⭐</div>
            
            <div class="layer tier-1" id="tier1">
                <div class="layer-decoration"></div>
            </div>
            <div class="layer tier-2" id="tier2">
                <div class="layer-decoration"></div>
            </div>
            <div class="layer tier-3" id="tier3">
                <div class="layer-decoration"></div>
            </div>
            <div class="layer tier-4" id="tier4">
                <div class="layer-decoration"></div>
            </div>
            <div class="layer tier-5" id="tier5">
                <div class="layer-decoration"></div>
            </div>
            
            <div class="trunk"></div>
            <div class="snow"></div>
        </div>

        <div class="gifts" id="giftsContainer">
            <div class="gift"></div>
            <div class="gift"></div>
            <div class="gift"></div>
            <div class="gift"></div>
        </div>
    </div>

    <script>
        // Создание фоновых снежинок
        function createBackgroundSnowflakes() {
            const background = document.getElementById('background');
            const snowflakes = ['❄', '❅', '❆', '•'];
            
            for (let i = 0; i < 30; i++) {
                const snowflake = document.createElement('div');
                snowflake.className = 'bg-snowflake';
                snowflake.innerHTML = snowflakes[Math.floor(Math.random() * snowflakes.length)];
                snowflake.style.left = Math.random() * 100 + 'vw';
                snowflake.style.animationDelay = Math.random() * 10 + 's';
                snowflake.style.fontSize = (Math.random() *15 + 10) + 'px';
                background.appendChild(snowflake);
            }
        }

        // Добавление украшений
        function addDecoration() {
            const tiers = ['tier1', 'tier2', 'tier3', 'tier4', 'tier5'];
            const colors = ['red', 'blue', 'yellow', 'purple', 'orange', 'green', 'cyan'];
            
            for (let i = 0; i < 5; i++) {
                const tier = document.getElementById(tiers[Math.floor(Math.random() * tiers.length)]);
                const decoration = document.createElement('div');
                decoration.className = `decoration ${colors[Math.floor(Math.random() * colors.length)]}`;
                
                const size = Math.random() * 20 + 10;
                decoration.style.width = size + 'px';
                decoration.style.height = size + 'px';
                
                const left = 20 + Math.random() * 60;
                const top = 10 + Math.random() * 70;
                
                decoration.style.left = left + '%';
                decoration.style.top = top + '%';
                decoration.style.animationDelay = Math.random() * 3 + 's';
                
                tier.appendChild(decoration);
            }
        }

        // Переключение анимаций
        function toggleAnimation() {
            const decorations = document.querySelectorAll('.decoration');
            const animated = decorations[0]?.style.animationPlayState !== 'paused';
            
            decorations.forEach(decoration => {
                decoration.style.animationPlayState = animated ? 'paused' : 'running';
            });
            
            const gifts = document.querySelectorAll('.gift');
            gifts.forEach(gift => {
                gift.style.animationPlayState = animated ? 'paused' : 'running';
            });
        }

        // Смена темы
        function changeTheme() {
            const themes = [
                'linear-gradient(135deg, #0f2b46, #1a535c, #2a9d8f)',
                'linear-gradient(135deg, #2d1b69, #8b5fbf, #c06c84)',
                'linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d)',
                'linear-gradient(135deg, #0f3443, #34e89e, #0f3443)',
                'linear-gradient(135deg, #4A00E0, #8E2DE2, #4A00E0)'
            ];
            
            const randomTheme = themes[Math.floor(Math.random() * themes.length)];
            document.body.style.background = randomTheme;
        }

        // Добавление подарка
        function addGift() {
            const giftsContainer = document.getElementById('giftsContainer');
            const gift = document.createElement('div');
            gift.className = 'gift';
            
            const colors = [
                'linear-gradient(45deg, #ff4444, #ff6b6b)',
                'linear-gradient(45deg, #4444ff, #6b6bff)',
                'linear-gradient(45deg, #44ff44, #6bff6b)',
                'linear-gradient(45deg, #ffff44, #ffff6b)',
                'linear-gradient(45deg, #ff44ff, #ff6bff)',
                'linear-gradient(45deg, #44ffff, #6bffff)'
            ];
            
            gift.style.background = colors[Math.floor(Math.random() * colors.length)];
            gift.style.animationDelay = Math.random() * 6 + 's';
            
            giftsContainer.appendChild(gift);
        }

        // Инициализация
        document.addEventListener('DOMContentLoaded', function() {
            createBackgroundSnowflakes();
            addDecoration();
            addDecoration();
            addDecoration();
        });

        // Добавляем пузырьки на ярусы
        function addBubbles() {
            const tiers = ['tier1', 'tier2', 'tier3', 'tier4', 'tier5'];
            
            tiers.forEach(tierId => {
                const tier = document.getElementById(tierId);
                const decorationLayer = tier.querySelector('.layer-decoration');
                
                for (let i = 0; i < 3; i++) {
                    const bubble = document.createElement('div');
                    bubble.

className = 'bubble';
                    bubble.style.background = 'border-radius: 2px';
        }

            .tru
                    bubble.style.width = Math.random() * 15 + 5 + 'px';
                    bubble.style.height = bubble.style.width;
                    bubble.style.left = Math.random() * 80 + 10 + '%';
                    bubble.style.top = Math.random() * 80 + 10 + '%';
                    bubble.style.animationDelay = Math.random() * 4 + 's';
                    
                    decorationLayer.appendChild(bubble);
                }
            });
        }

        addBubbles();
    </script>
</body>
</html>
